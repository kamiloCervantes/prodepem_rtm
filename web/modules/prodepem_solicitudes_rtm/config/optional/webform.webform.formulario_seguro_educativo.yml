id: formulario_seguro_educativo
title: 'Seguro Estudiantil - Formato AP Seguro Educativo'
description: 'Formulario de registro para Seguro Estudiantil y Accidentes Personales (AP) Educativo basado en el formato de Colegio Distrital Santa Magdalena Sofía.'
categories: {  }
elements: |
  informacion_institucional:
    '#type': fieldset
    '#title': 'Información Institucional'
    institucion_educativa:
      '#type': textfield
      '#title': 'Institución Educativa'
      '#default_value': 'COLEGIO DISTRITAL SANTA MAGDALENA SOFIA'
      '#required': true
      '#description': 'Nombre de la institución educativa o colegio'
    periodo:
      '#type': textfield
      '#title': 'Periodo / Año Lectivo'
      '#default_value': '2027'
      '#required': true
      '#description': 'Año lectivo o periodo de vigencia'
  datos_del_estudiante:
    '#type': fieldset
    '#title': 'Datos del Estudiante (Asegurado)'
    primer_apellido:
      '#type': textfield
      '#title': 'Primer Apellido'
      '#required': true
      '#placeholder': 'Ingrese el primer apellido'
    segundo_apellido:
      '#type': textfield
      '#title': 'Segundo Apellido'
      '#required': false
      '#placeholder': 'Ingrese el segundo apellido (si aplica)'
    primer_nombre:
      '#type': textfield
      '#title': 'Primer Nombre'
      '#required': true
      '#placeholder': 'Ingrese el primer nombre'
    segundo_nombre:
      '#type': textfield
      '#title': 'Segundo Nombre'
      '#required': false
      '#placeholder': 'Ingrese el segundo nombre (si aplica)'
    tipo_documento:
      '#type': select
      '#title': 'Tipo Documento'
      '#required': true
      '#empty_option': '- Seleccione el tipo de documento -'
      '#options':
        TI: 'Tarjeta de Identidad (T.I.)'
        RC: 'Registro Civil (R.C.)'
        CC: 'Cédula de Ciudadanía (C.C.)'
        CE: 'Cédula de Extranjería (C.E.)'
        PPT: 'Permiso por Protección Temporal (PPT)'
        PEP: 'Permiso Especial de Permanencia (PEP)'
        PAS: 'Pasaporte'
        NUIP: 'Número Único de Identificación Personal (NUIP)'
        OTRO: 'Otro'
    numero_documento:
      '#type': textfield
      '#title': 'N° Documento'
      '#required': true
      '#placeholder': 'Número de documento de identidad'
    fecha_de_nacimiento:
      '#type': date
      '#title': 'Fecha de Nacimiento'
      '#description': 'Formato: DD/MM/AAAA'
      '#required': true
      '#datepicker': true
      '#date_date_format': 'd/m/Y'
    sexo:
      '#type': select
      '#title': 'Sexo'
      '#required': true
      '#empty_option': '- Seleccione el sexo -'
      '#options':
        M: 'Masculino'
        F: 'Femenino'
        OTRO: 'Otro'
    grado_a_cursar:
      '#type': select
      '#title': 'Grado a Cursar'
      '#required': true
      '#empty_option': '- Seleccione el grado escolar -'
      '#options':
        Maternal: 'Maternal'
        Parvulos: 'Párvulos'
        Pre-Jardin: 'Pre-Jardín'
        Jardin: 'Jardín'
        Transicion: 'Transición / Grado Cero'
        Primero: '1° Primero de Primaria'
        Segundo: '2° Segundo de Primaria'
        Tercero: '3° Tercero de Primaria'
        Cuarto: '4° Cuarto de Primaria'
        Quinto: '5° Quinto de Primaria'
        Sexto: '6° Sexto de Bachillerato'
        Septimo: '7° Séptimo de Bachillerato'
        Octavo: '8° Octavo de Bachillerato'
        Noveno: '9° Noveno de Bachillerato'
        Decimo: '10° Décimo'
        Once: '11° Once'
        Docente_Administrativo: 'Docente / Administrativo'
        Otro: 'Otro'
  informacion_del_pago:
    '#type': fieldset
    '#title': 'Información del Pago'
    valor:
      '#type': number
      '#title': 'Valor'
      '#description': 'Valor del seguro en pesos colombianos ($ COP)'
      '#required': true
      '#min': 0
      '#step': 100
      '#placeholder': 'Ej: 25000'
      '#field_prefix': '$'
    medio_de_pago:
      '#type': select
      '#title': 'Medio de Pago'
      '#required': true
      '#empty_option': '- Seleccione el medio de pago -'
      '#options':
        Efectivo: 'Efectivo en Institución Educativa'
        Transferencia: 'Transferencia Bancaria (Bancolombia, Nequi, Daviplata, etc.)'
        PSE: 'PSE / Pago en Línea'
        Consignacion: 'Consignación Bancaria / Corresponsal'
        Tarjeta_Debito: 'Tarjeta Débito'
        Tarjeta_Credito: 'Tarjeta de Crédito'
        Otro: 'Otro'
    referencia_de_pago:
      '#type': textfield
      '#title': 'Referencia de Pago'
      '#description': 'Número de comprobante, recibo o código de transacción'
      '#required': false
      '#placeholder': 'Ej: N° de comprobante o autorización'
    fecha_de_pago:
      '#type': date
      '#title': 'Fecha de Pago'
      '#description': 'Formato: DD/MM/AAAA'
      '#required': true
      '#datepicker': true
      '#date_date_format': 'd/m/Y'
  observaciones:
    '#type': fieldset
    '#title': 'Observaciones y Comentarios'
    observaciones_comentarios:
      '#type': textarea
      '#title': 'Observaciones | Comentarios'
      '#description': 'Notas adicionales, novedades médicas o aclaraciones sobre el seguro educativo'
      '#required': false
      '#rows': 4
      '#placeholder': 'Observaciones o comentarios adicionales...'
  actions:
    '#type': webform_actions
    '#title': 'Enviar Registro'
    '#submit__label': 'Registrar Seguro Estudiantil'
