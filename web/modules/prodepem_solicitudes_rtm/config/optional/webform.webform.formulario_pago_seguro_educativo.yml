id: formulario_pago_seguro_educativo
title: 'Seguro Estudiantil - Reporte de Pago y Comprobante'
description: 'Formulario para el reporte de información de pago y cargue de comprobante para el Seguro Estudiantil / Accidentes Personales.'
categories: {  }
elements: |
  identificacion_del_seguro:
    '#type': fieldset
    '#title': 'Identificación del Seguro'
    identificador_seguro:
      '#type': textfield
      '#title': 'Identificador del Seguro'
      '#required': true
      '#placeholder': 'Ingrese el identificador, código o N° de registro del seguro'
      '#description': 'Código o identificador del seguro educativo registrado previamente.'
  informacion_del_pago:
    '#type': fieldset
    '#title': 'Información del Pago'
    valor:
      '#type': number
      '#title': 'Valor'
      '#description': 'Valor cancelado en pesos colombianos ($ COP)'
      '#required': true
      '#min': 0
      '#step': 100
      '#placeholder': 'Ej: 25000'
      '#field_prefix': '$'
    medio_de_pago:
      '#type': select
      '#title': 'Medio de Pago'
      '#required': true
      '#empty_option': '- Seleccione el medio de pago -'
      '#options':
        Efectivo: 'Efectivo en Institución Educativa'
        Transferencia: 'Transferencia Bancaria (Bancolombia, Nequi, Daviplata, etc.)'
        PSE: 'PSE / Pago en Línea'
        Consignacion: 'Consignación Bancaria / Corresponsal'
        Tarjeta_Debito: 'Tarjeta Débito'
        Tarjeta_Credito: 'Tarjeta de Crédito'
        Otro: 'Otro'
    referencia_de_pago:
      '#type': textfield
      '#title': 'Referencia de Pago'
      '#description': 'Número de comprobante, recibo o código de autorización'
      '#required': false
      '#placeholder': 'Ej: N° de comprobante o autorización'
    fecha_de_pago:
      '#type': date
      '#title': 'Fecha de Pago'
      '#description': 'Formato: DD/MM/AAAA'
      '#required': true
      '#datepicker': true
      '#date_date_format': 'd/m/Y'
    comprobante_pago:
      '#type': managed_file
      '#title': 'Comprobante de Pago'
      '#description': 'Adjunte el soporte o comprobante de la transacción (formatos permitidos: PDF, JPG, JPEG, PNG. Tamaño máx: 10 MB).'
      '#required': true
      '#file_extensions': 'pdf jpg jpeg png'
      '#max_filesize': '10MB'
  observaciones:
    '#type': fieldset
    '#title': 'Observaciones y Comentarios'
    observaciones_comentarios:
      '#type': textarea
      '#title': 'Observaciones | Comentarios'
      '#description': 'Notas adicionales o aclaraciones sobre el pago'
      '#required': false
      '#rows': 3
      '#placeholder': 'Observaciones adicionales sobre el pago...'
  actions:
    '#type': webform_actions
    '#title': 'Enviar Comprobante'
    '#submit__label': 'Subir Comprobante de Pago'
